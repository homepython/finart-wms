<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FINART Coletor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FINART - Coletor de Etiquetas</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; }

    .top-bar {
      background: var(--card); padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 10px; gap: 8px;
    }
    .logo { background: var(--primary); color: #fff; font-weight: 800; padding: 5px 12px; border-radius: 6px; letter-spacing: 1px; }
    .btn-top { text-decoration: none; font-size: 12px; font-weight: 700; color: var(--primary); background: #e0f2fe; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; }

    .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

    .status-motor {
      font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 6px;
      text-align: center; margin-bottom: 8px; background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0;
    }

    /* Visor da Etiqueta Completa */
    .visor-wrapper {
      position: relative; width: 100%; height: 240px; background: #0f172a;
      border-radius: 10px; overflow: hidden; border: 2px solid var(--primary);
    }
    #video-camera { width: 100%; height: 100%; object-fit: cover; }
    .moldura-etiqueta {
      position: absolute; inset: 14px; border: 2px dashed #38bdf8;
      border-radius: 8px; pointer-events: none; display: flex; align-items: flex-end;
      justify-content: center; padding-bottom: 6px;
    }
    .moldura-etiqueta span {
      background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 11px;
      padding: 4px 10px; border-radius: 4px; font-weight: 700;
    }

    .progresso-box {
      display: none; margin-top: 10px; padding: 12px; border-radius: 8px;
      background: #fef3c7; color: #b45309; font-size: 14px; font-weight: 800; text-align: center;
    }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .btn-ler-agora { background: var(--primary); color: #fff; font-size: 16px; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25); }
    .btn-macro { background: #0f172a; color: #fff; font-size: 15px; }
    .btn-confirm { background: var(--success); color: #fff; font-size: 16px; padding: 16px; }
    .btn-cancel { background: #e2e8f0; color: var(--text); }

    label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 8px; margin-bottom: 3px; text-transform: uppercase; }
    input {
      width: 100%; padding: 10px; font-size: 16px; font-weight: 700;
      border: 2px solid var(--border); border-radius: 8px; color: var(--text); text-align: center;
    }
    .input-left { text-align: left; font-size: 14px; font-weight: 600; }

    .badge-lote { background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 5px; font-weight: 700; }

    .saldo-preview {
      background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px;
      padding: 12px; text-align: center; margin: 12px 0 6px;
    }
    .saldo-preview small { color: var(--success); font-weight: 700; font-size: 11px; text-transform: uppercase; display: block; }
    .saldo-preview strong { color: var(--success); font-size: 24px; font-weight: 900; }

    .live-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .live-item:last-child { border-bottom: none; }
  </style>
</head>
<body ontouchstart="destravarSomMobile()" onclick="destravarSomMobile()">

  <!-- Player de Áudio WAV Real (Toca alto mesmo no iPhone e Android após processar foto) -->
  <audio id="player-bip" preload="auto"></audio>

  <div class="top-bar">
    <span class="logo">FINART</span>
    <button class="btn-top" onclick="tocarBipIndustrial()">🔊 Testar Bipe Alto</button>
    <a href="/" class="btn-top">Ver Painel</a>
  </div>

  <!-- TELA 1: LEITOR DA ETIQUETA COMPLETA (AO VIVO + FOTO MACRO) -->
  <div class="box" id="tela-scanner">
    <div class="status-motor" id="status-motor">
      ⚡ Carregando leitor óptico de alta velocidade...
    </div>

    <div class="visor-wrapper">
      <video id="video-camera" autoplay playsinline muted></video>
      <div class="moldura-etiqueta">
        <span>Aponte para a ETIQUETA (Lê sozinho ou toque abaixo)</span>
      </div>
    </div>

    <div class="progresso-box" id="progresso-box">
      ⚡ Lendo todos os dados da etiqueta...
    </div>

    <!-- OPÇÃO 1: Captura instantânea da etiqueta pelo visor ao vivo -->
    <button class="btn btn-ler-agora" onclick="capturarEtiquetaDoVisor(true)">
      📸 LER ETIQUETA DO VISOR AGORA
    </button>

    <!-- OPÇÃO 2: Foto Macro HD da câmera nativa do celular -->
    <input type="file" accept="image/*" capture="environment" id="input-macro" style="display:none" onchange="lerFotoMacro(this)" />
    <button class="btn btn-macro" onclick="tocarBipCurto(); document.getElementById('input-macro').click()">
      🔍 TIRAR FOTO MACRO DO CELULAR (ALTA PRECISÃO)
    </button>
  </div>

  <!-- TELA 2: CONFERÊNCIA COMPLETA DOS DADOS LIDOS DA ETIQUETA -->
  <div class="box" id="tela-confirmacao" style="display: none;">
    <h3 style="margin-bottom: 8px; color: var(--primary);">✅ Etiqueta Lida — Confira os Dados</h3>

    <label>Cliente:</label>
    <input type="text" id="conf-cliente" class="input-left" oninput="atualizarRegraClienteManual()" />

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Pedido:</label>
        <input type="text" id="conf-pedido" class="input-left" oninput="sincronizarLotePeloPedido()" />
      </div>
      <div>
        <label>Nº do Lote:</label>
        <input type="text" id="conf-lote" class="input-left" style="background:#fef3c7; color:#b45309;" />
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Código do Item:</label>
        <input type="text" id="conf-item" class="input-left" oninput="atualizarRegraClienteManual()" />
      </div>
      <div>
        <label>Volume (Ex: 370/400):</label>
        <input type="text" id="conf-vol-etiqueta" class="input-left" placeholder="Opcional" />
      </div>
    </div>

    <label>Descrição Completa do Produto:</label>
    <input type="text" id="conf-produto" class="input-left" />

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label id="label-volumes">Caixas/Sacos no Palete:</label>
        <input type="number" id="input-volumes" oninput="recalcularPreview()" style="border-color: var(--primary); font-size: 20px;" />
      </div>
      <div>
        <label>QTD Peças p/ Caixa:</label>
        <input type="number" id="conf-pecas" oninput="recalcularPreview()" style="font-size: 20px;" />
      </div>
    </div>

    <div class="saldo-preview">
      <small>Saldo Total deste Palete</small>
      <strong id="preview-total">0 peças</strong>
    </div>

    <button class="btn btn-confirm" onclick="confirmarEnvio()">✅ CONFIRMAR E SUBIR SALDO</button>
    <button class="btn btn-cancel" onclick="voltarParaCamera()">🔄 Ler Outra Etiqueta</button>
  </div>

  <!-- RESUMO DE SALDOS AO VIVO -->
  <div class="box">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <strong style="font-size:13px; color:var(--muted);">SALDOS ATUAIS SINCRONIZADOS</strong>
      <span style="font-size:11px; color:var(--success); font-weight:700;">● SALVO E SEGURO</span>
    </div>
    <div id="lista-ao-vivo">Carregando saldos...</div>
  </div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http')
      ? ''
      : 'https://finart-wms.onrender.com';

    let ocrWorker = null;
    let motorPronto = false;
    let lendoAgora = false;
    let timerAutoScan = null;
    let streamVideo = null;
    let somDestravado = false;

    // 1. GERADOR DE ARQUIVO .WAV REAL EM MEMÓRIA (Toca ALTO em qualquer celular, Android ou iPhone)
    function criarWavBipBase64(freq = 2400, duracaoMs = 220) {
      const sampleRate = 44100;
      const numSamples = Math.floor((sampleRate * duracaoMs) / 1000);
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      // Onda quadrada de potência máxima (32767) igual a bip de coletor Zebra/Honeywell
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const onda = Math.sin(2 * Math.PI * freq * t) >= 0 ? 32767 : -32767;
        view.setInt16(44 + i * 2, onda, true);
      }

      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    const wavAltoURI = criarWavBipBase64(2450, 240);

    function destravarSomMobile() {
      const player = document.getElementById('player-bip');
      if (!player.src) player.src = wavAltoURI;
      if (!somDestravado) {
        player.volume = 0.01;
        player.play().then(() => {
          player.pause();
          player.currentTime = 0;
          player.volume = 1.0;
          somDestravado = true;
        }).catch(() => {});
      }
    }

    function tocarBipIndustrial() {
      try {
        if (navigator.vibrate) navigator.vibrate([200, 50, 150]);
        const player = document.getElementById('player-bip');
        if (!player.src) player.src = wavAltoURI;
        player.volume = 1.0;
        player.currentTime = 0;
        player.play().catch(() => {});
      } catch (e) {}
    }

    function tocarBipCurto() {
      try {
        if (navigator.vibrate) navigator.vibrate(80);
        const player = document.getElementById('player-bip');
        if (!player.src) player.src = wavAltoURI;
        player.volume = 1.0;
        player.currentTime = 0;
        player.play().catch(() => {});
      } catch (e) {}
    }

    // 2. INICIALIZA O LEITOR ÓPTICO UMA ÚNICA VEZ AO ABRIR (DEIXA A LEITURA 5X MAIS RÁPIDA)
    async function inicializarMotorOptico() {
      const badge = document.getElementById('status-motor');
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        // PSM 6 = Lê linha por linha da esquerda para a direita (NUNCA separa QTD: de 180 nem PEDIDO: de 006437)
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: '6'
        });
        motorPronto = true;
        badge.innerText = '✅ Leitor de Etiqueta Ativo (Ao Vivo + Macro Rápida)';
      } catch (e) {
        console.error('Erro ao iniciar OCR:', e);
        badge.innerText = '⚠️ Modo de leitura básico ativo';
      }
    }

    // 3. CÂMERA AO VIVO QUE LÊ A ETIQUETA INTEIRA AUTOMATICAMENTE
    async function iniciarCameraAoVivo() {
      const video = document.getElementById('video-camera');
      try {
        if (streamVideo) streamVideo.getTracks().forEach(t => t.stop());
        streamVideo = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = streamVideo;

        // Faz leituras automáticas da etiqueta a cada 1.6s enquanto você aponta a câmera
        if (timerAutoScan) clearInterval(timerAutoScan);
        timerAutoScan = setInterval(() => {
          if (!lendoAgora && motorPronto && document.getElementById('tela-scanner').style.display !== 'none') {
            capturarEtiquetaDoVisor(false);
          }
        }, 1600);
      } catch (err) {
        console.warn('Câmera:', err);
      }
    }

    // Prepara a imagem mantendo as letras pretas nítidas e rápidas de ler (950px)
    function prepararCanvasEtiqueta(fonteImgOuVideo, wOrig, hOrig) {
      const maxDim = 950;
      let w = wOrig;
      let h = hOrig;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(fonteImgOuVideo, 0, 0, w, h);
      return canvas;
    }

    // Leitura pelo Visor Ao Vivo (automática ou apertando o botão azul)
    async function capturarEtiquetaDoVisor(manual) {
      const video = document.getElementById('video-camera');
      if (!video || !video.videoWidth || lendoAgora) return;

      if (manual) tocarBipCurto();
      lendoAgora = true;

      const prog = document.getElementById('progresso-box');
      if (manual) prog.style.display = 'block';

      try {
        const canvas = prepararCanvasEtiqueta(video, video.videoWidth, video.videoHeight);
        await reconhecerTextoEEnviar(canvas, manual);
      } finally {
        if (manual) prog.style.display = 'none';
        lendoAgora = false;
      }
    }

    // Leitura pela Foto Macro do Celular (Qualidade máxima em ~1.5 segundo)
    function lerFotoMacro(input) {
      if (!input.files || !input.files[0]) return;
      lendoAgora = true;
      const prog = document.getElementById('progresso-box');
      prog.style.display = 'block';

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          try {
            const canvas = prepararCanvasEtiqueta(img, img.width, img.height);
            await reconhecerTextoEEnviar(canvas, true);
          } finally {
            prog.style.display = 'none';
            lendoAgora = false;
            input.value = '';
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function reconhecerTextoEEnviar(canvas, mostrarAlertaSeFalhar) {
      try {
        let textoExtraido = '';
        if (motorPronto && ocrWorker) {
          const { data: { text } } = await ocrWorker.recognize(canvas);
          textoExtraido = text || '';
        } else {
          const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
          textoExtraido = text || '';
        }

        // No modo automático ao vivo, só envia ao servidor quando detectar palavras da etiqueta
        if (!mostrarAlertaSeFalhar) {
          const temDadosEtiqueta = /PEDIDO|CLIENTE|DEVINTEX|FLORA|ITEM|PRODUTO|LOTE|006\d{3}|PT-|FR-/i.test(textoExtraido);
          if (!temDadosEtiqueta) return;
        }

        const res = await fetch(`${API_BASE}/api/interpretar-bipe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ textoEtiqueta: textoExtraido })
        });

        const data = await res.json();
        if (!res.ok) {
          if (mostrarAlertaSeFalhar) {
            alert(data.erro || 'Aproxime um pouco mais da etiqueta para focar as letras.');
          }
          return;
        }

        // No modo automático ao vivo, exige que tenha lido Item + Lote + Qtd para bipar sozinho sem erro
        if (!mostrarAlertaSeFalhar && (!data.item || !data.lote || !data.qtd_pecas_por_volume)) {
          return;
        }

        if (timerAutoScan) clearInterval(timerAutoScan);
        tocarBipIndustrial();
        abrirTelaConfirmacao(data);
      } catch (e) {
        if (mostrarAlertaSeFalhar) alert('Erro ao processar leitura.');
      }
    }

    function abrirTelaConfirmacao(data) {
      document.getElementById('conf-cliente').value = data.cliente || '';
      document.getElementById('conf-pedido').value = data.pedido || '';
      document.getElementById('conf-lote').value = data.lote || '';
      document.getElementById('conf-item').value = data.item || '';
      document.getElementById('conf-produto').value = data.produto || '';
      document.getElementById('conf-pecas').value = data.qtd_pecas_por_volume || '';
      document.getElementById('conf-vol-etiqueta').value = data.volume_etiqueta || '';
      document.getElementById('label-volumes').innerText = `Qtd ${data.tipoEmbalagem || 'CAIXA'}S (Padrão: ${data.qtd_volumes_sugerida || 15}):`;
      document.getElementById('input-volumes').value = data.qtd_volumes_sugerida || 15;

      recalcularPreview();
      document.getElementById('tela-scanner').style.display = 'none';
      document.getElementById('tela-confirmacao').style.display = 'block';
    }

    function sincronizarLotePeloPedido() {
      const ped = document.getElementById('conf-pedido').value.trim();
      if (ped.length >= 5) {
        document.getElementById('conf-lote').value = `${ped}.1`;
      }
    }

    function atualizarRegraClienteManual() {
      const cli = (document.getElementById('conf-cliente').value || '').toUpperCase();
      const item = (document.getElementById('conf-item').value || '').toUpperCase();
      const prod = (document.getElementById('conf-produto').value || '').toUpperCase();

      if (cli.includes('DEVINTEX') && (item === 'PT-7908' || prod.includes('1000 GRS'))) {
        document.getElementById('input-volumes').value = 22;
      } else if (cli.includes('DEVINTEX')) {
        document.getElementById('input-volumes').value = 15;
      } else if (cli.length > 2) {
        document.getElementById('input-volumes').value = 20;
      }
      recalcularPreview();
    }

    function recalcularPreview() {
      const vols = parseInt(document.getElementById('input-volumes').value || '0', 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value || '0', 10);
      const total = vols * pecas;
      document.getElementById('preview-total').innerText = `${total.toLocaleString('pt-BR')} peças`;
    }

    async function confirmarEnvio() {
      const vols = parseInt(document.getElementById('input-volumes').value, 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value, 10);
      if (!vols || vols <= 0 || !pecas || pecas <= 0) {
        return alert('Verifique a quantidade de caixas e de peças por caixa!');
      }

      const payload = {
        cliente: document.getElementById('conf-cliente').value,
        pedido: document.getElementById('conf-pedido').value,
        lote: document.getElementById('conf-lote').value,
        item: document.getElementById('conf-item').value,
        produto: document.getElementById('conf-produto').value,
        qtd_volumes_palete: vols,
        qtd_pecas_por_volume: pecas,
        volume_etiqueta: document.getElementById('conf-vol-etiqueta').value
      };

      const res = await fetch(`${API_BASE}/api/paletes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const resultado = await res.json();
      if (!res.ok) {
        alert(resultado.erro);
        return;
      }

      tocarBipIndustrial();
      await atualizarResumoAoVivo();
      voltarParaCamera();
    }

    function voltarParaCamera() {
      document.getElementById('tela-confirmacao').style.display = 'none';
      document.getElementById('tela-scanner').style.display = 'block';
      iniciarCameraAoVivo();
    }

    async function atualizarResumoAoVivo() {
      try {
        const res = await fetch(`${API_BASE}/api/dashboard?t=${Date.now()}`, { cache: 'no-store' });
        const { consolidado, historico } = await res.json();

        const backupSalvo = JSON.parse(localStorage.getItem('finart_backup_paletes') || '[]');
        if (historico.length === 0 && backupSalvo.length > 0) {
          await fetch(`${API_BASE}/api/restaurar-backup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ historico: backupSalvo })
          });
          return atualizarResumoAoVivo();
        }

        if (historico.length > 0) {
          localStorage.setItem('finart_backup_paletes', JSON.stringify(historico));
        }

        const div = document.getElementById('lista-ao-vivo');
        if (!consolidado || consolidado.length === 0) {
          div.innerHTML = '<small style="color:var(--muted)">Nenhum palete bipado ainda.</small>';
          return;
        }
        div.innerHTML = consolidado.slice(0, 8).map(r => `
          <div class="live-item">
            <div>
              <strong>${r.cliente}</strong> <span class="badge-lote">Lote ${r.lote}</span><br/>
              <small style="color:var(--muted)">${r.item} • ${r.total_paletes} palete(s) (${r.total_caixas_ou_sacaria} vol.)</small>
            </div>
            <strong style="color:var(--success); font-size:15px;">${r.saldo_total_pecas.toLocaleString('pt-BR')} pçs</strong>
          </div>
        `).join('');
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) atualizarResumoAoVivo();
    });
    setInterval(atualizarResumoAoVivo, 2000);

    window.onload = () => {
      inicializarMotorOptico();
      iniciarCameraAoVivo();
      atualizarResumoAoVivo();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FINART Coletor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FINART - Coletor Mobile</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; }

    .top-bar {
      background: var(--card); padding: 12px 16px; border-radius: 10px;
      border: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 14px;
    }
    .logo { background: var(--primary); color: #fff; font-weight: 800; padding: 5px 12px; border-radius: 6px; letter-spacing: 1px; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--primary); }
    .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }

    .info-grid { display: grid; gap: 8px; margin-bottom: 14px; font-size: 14px; }
    .badge-lote { background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 5px; font-weight: 700; }

    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; }
    input {
      width: 100%; padding: 12px; font-size: 18px; font-weight: 700;
      border: 2px solid var(--border); border-radius: 8px; color: var(--text); text-align: center;
    }
    .saldo-preview {
      background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px;
      padding: 14px; text-align: center; margin: 16px 0;
    }
    .saldo-preview small { color: var(--success); font-weight: 700; font-size: 11px; text-transform: uppercase; display: block; }
    .saldo-preview strong { color: var(--success); font-size: 26px; font-weight: 900; }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
    .btn-confirm { background: var(--success); color: #fff; }
    .btn-cancel { background: #e2e8f0; color: var(--text); }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="logo">FINART</span>
    <strong style="font-size: 14px;">Coletor Online</strong>
  </div>

  <div class="box" id="tela-scanner">
    <div id="reader"></div>
    <p class="hint">Aponte a câmera para o código de barras inferior da etiqueta</p>
    <div style="margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px;">
      <label>Ou digite/cole o código manualmente:</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="input-manual" placeholder="Ex: FR-12588;0065801;220" style="font-size: 14px; font-weight: 500; text-align: left;" />
        <button onclick="processarCodigo(document.getElementById('input-manual').value)" style="background: var(--primary); color:#fff; border:none; padding: 0 16px; border-radius: 8px; font-weight: 700;">OK</button>
      </div>
    </div>
  </div>

  <div class="box" id="tela-confirmacao" style="display: none;">
    <h3 style="margin-bottom: 12px; color: var(--primary);">Confirmar Leitura do Palete</h3>
    <div class="info-grid">
      <div><strong>Cliente:</strong> <span id="conf-cliente"></span></div>
      <div><strong>Pedido:</strong> <span id="conf-pedido"></span> | <strong>Lote:</strong> <span class="badge-lote" id="conf-lote"></span></div>
      <div><strong>Item:</strong> <span id="conf-item"></span></div>
      <div><strong>Produto:</strong> <span id="conf-produto"></span></div>
      <div><strong>Peças por Volume:</strong> <span id="conf-pecas"></span> un.</div>
    </div>

    <label id="label-volumes">Qtd de Caixas/Sacos no Palete:</label>
    <input type="number" id="input-volumes" oninput="recalcularPreview()" />

    <label>Volume da Etiqueta (Opcional - ex: 029/125):</label>
    <input type="text" id="input-vol-etiqueta" placeholder="Evita bipar a mesma etiqueta 2x" style="font-size: 15px; font-weight: 500;" />

    <div class="saldo-preview">
      <small>Saldo que vai subir para o sistema</small>
      <strong id="preview-total">0 peças</strong>
    </div>

    <button class="btn btn-confirm" onclick="confirmarEnvio()">CONFIRMAR E SUBIR SALDO</button>
    <button class="btn btn-cancel" onclick="voltarParaCamera()">Cancelar / Bipar Outra</button>
  </div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http')
      ? ''
      : 'https://finart-wms.onrender.com';

    let dadosAtuais = null;
    let html5QrCode = null;

    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    function iniciarCamera() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 260, height: 120 } },
        (decodedText) => {
          tocarBip();
          html5QrCode.stop().then(() => processarCodigo(decodedText));
        },
        () => {}
      ).catch(err => console.warn("Aguardando câmera:", err));
    }

    async function processarCodigo(codigo) {
      if (!codigo || !codigo.includes(';')) {
        alert('Etiqueta inválida! Aponte para o código de barras de baixo (Ex: FR-12588;0065801;220)');
        voltarParaCamera();
        return;
      }

      const res = await fetch(`${API_BASE}/api/interpretar-bipe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigoLido: codigo })
      });

      const data = await res.json();
      if (!res.ok) {
        alert(data.erro || 'Erro ao ler etiqueta');
        voltarParaCamera();
        return;
      }

      dadosAtuais = data;
      document.getElementById('conf-cliente').innerText = data.cliente;
      document.getElementById('conf-pedido').innerText = data.pedido;
      document.getElementById('conf-lote').innerText = data.lote;
      document.getElementById('conf-item').innerText = data.item;
      document.getElementById('conf-produto').innerText = data.produto;
      document.getElementById('conf-pecas').innerText = data.qtd_pecas_por_volume;
      document.getElementById('label-volumes').innerText = `Qtd de ${data.tipoEmbalagem}S no Palete (Padrão: ${data.qtd_volumes_sugerida}):`;
      document.getElementById('input-volumes').value = data.qtd_volumes_sugerida;
      document.getElementById('input-vol-etiqueta').value = '';

      recalcularPreview();
      document.getElementById('tela-scanner').style.display = 'none';
      document.getElementById('tela-confirmacao').style.display = 'block';
    }

    function recalcularPreview() {
      if (!dadosAtuais) return;
      const vols = parseInt(document.getElementById('input-volumes').value || '0', 10);
      const total = vols * dadosAtuais.qtd_pecas_por_volume;
      document.getElementById('preview-total').innerText = `${total.toLocaleString('pt-BR')} peças`;
    }

    async function confirmarEnvio() {
      const vols = parseInt(document.getElementById('input-volumes').value, 10);
      if (!vols || vols <= 0) return alert('Informe uma quantidade válida!');

      const res = await fetch(`${API_BASE}/api/paletes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...dadosAtuais,
          qtd_volumes_palete: vols,
          volume_etiqueta: document.getElementById('input-vol-etiqueta').value
        })
      });

      const resultado = await res.json();
      if (!res.ok) {
        alert(resultado.erro);
        return;
      }

      tocarBip();
      voltarParaCamera();
    }

    function voltarParaCamera() {
      document.getElementById('tela-confirmacao').style.display = 'none';
      document.getElementById('tela-scanner').style.display = 'block';
      iniciarCamera();
    }

    window.onload = iniciarCamera;
  </script>
</body>
</html>

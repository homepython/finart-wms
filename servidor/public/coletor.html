<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FINART Coletor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FINART - Digitalizador de Etiquetas</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; }

    .top-bar {
      background: var(--card); padding: 12px 16px; border-radius: 10px;
      border: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .logo { background: var(--primary); color: #fff; font-weight: 800; padding: 5px 12px; border-radius: 6px; letter-spacing: 1px; }
    .btn-top { text-decoration: none; font-size: 12px; font-weight: 700; color: var(--primary); background: #e0f2fe; padding: 6px 10px; border-radius: 6px; }

    .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

    /* Visor Fotográfico HD da Etiqueta */
    .camera-wrapper {
      position: relative; width: 100%; height: 270px; background: #0f172a;
      border-radius: 10px; overflow: hidden; border: 2px solid var(--primary);
    }
    #video-hd {
      width: 100%; height: 100%; object-fit: cover;
    }
    #foto-congelada {
      display: none; width: 100%; height: 100%; object-fit: cover;
    }
    .guia-etiqueta {
      position: absolute; inset: 16px; border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 8px; pointer-events: none; display: flex; align-items: flex-end;
      justify-content: center; padding-bottom: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }
    .guia-etiqueta span {
      background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 11px;
      padding: 4px 10px; border-radius: 4px; font-weight: 600;
    }

    /* Linha laser de digitalização */
    .laser-scan {
      display: none; position: absolute; left: 16px; right: 16px; height: 3px;
      background: #10b981; box-shadow: 0 0 12px 3px #10b981;
      animation: scanMove 1.4s infinite ease-in-out;
    }
    @keyframes scanMove {
      0% { top: 20px; }
      50% { top: 245px; }
      100% { top: 20px; }
    }

    .status-leitura {
      display: none; margin-top: 10px; padding: 10px; border-radius: 8px;
      background: #e0f2fe; color: #0369a1; font-size: 13px; font-weight: 700; text-align: center;
    }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .btn-foto { background: var(--primary); color: #fff; font-size: 16px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn-nativo { background: #f1f5f9; color: var(--text); font-size: 13px; padding: 11px; border: 1px solid var(--border); }
    .btn-confirm { background: var(--success); color: #fff; }
    .btn-cancel { background: #e2e8f0; color: var(--text); }

    .miniatura-etiqueta {
      width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 10px;
    }

    label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; }
    input {
      width: 100%; padding: 10px; font-size: 16px; font-weight: 700;
      border: 2px solid var(--border); border-radius: 8px; color: var(--text); text-align: center;
    }
    .input-left { text-align: left; font-size: 14px; font-weight: 600; }

    .badge-lote { background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 5px; font-weight: 700; }

    .saldo-preview {
      background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px;
      padding: 12px; text-align: center; margin: 14px 0 6px;
    }
    .saldo-preview small { color: var(--success); font-weight: 700; font-size: 11px; text-transform: uppercase; display: block; }
    .saldo-preview strong { color: var(--success); font-size: 24px; font-weight: 900; }

    .live-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .live-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="logo">FINART</span>
    <strong style="font-size: 14px;">Digitalizador de Etiqueta</strong>
    <a href="/" class="btn-top">Ver Painel</a>
  </div>

  <!-- TELA 1: CÂMERA FOTOGRÁFICA HD PARA DIGITALIZAR A ETIQUETA -->
  <div class="box" id="tela-scanner">
    <div class="camera-wrapper">
      <video id="video-hd" autoplay playsinline muted></video>
      <img id="foto-congelada" alt="Foto da etiqueta" />
      <div class="guia-etiqueta">
        <span>Enquadre a etiqueta inteira aqui dentro</span>
      </div>
      <div class="laser-scan" id="laser-scan"></div>
    </div>

    <div class="status-leitura" id="status-leitura">
      🔍 Digitalizando foto da etiqueta, aguarde...
    </div>

    <button class="btn btn-foto" id="btn-fotografar" onclick="fotografarEDigitalizarVisor()">
      📸 FOTOGRAFAR E DIGITALIZAR ETIQUETA
    </button>

    <!-- Opção de câmera nativa do sistema caso a lente precise de foco macro extra -->
    <input type="file" accept="image/*" capture="environment" id="input-camera-nativa" style="display:none" onchange="digitalizarFotoNativa(this)" />
    <button class="btn btn-nativo" onclick="document.getElementById('input-camera-nativa').click()">
      📷 Ou Tirar Foto com Foco Macro da Câmera do Celular
    </button>
  </div>

  <!-- TELA 2: DADOS DIGITALIZADOS PARA CONFERÊNCIA E ENVIO -->
  <div class="box" id="tela-confirmacao" style="display: none;">
    <h3 style="margin-bottom: 8px; color: var(--primary);">Etiqueta Digitalizada com Sucesso</h3>
    <img id="img-conferencia" class="miniatura-etiqueta" alt="Etiqueta lida" />

    <label>Cliente Identificado:</label>
    <input type="text" id="conf-cliente" class="input-left" oninput="atualizarRegraClienteManual()" />

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Pedido:</label>
        <input type="text" id="conf-pedido" class="input-left" />
      </div>
      <div>
        <label>Nº do Lote:</label>
        <input type="text" id="conf-lote" class="input-left" style="background:#fef3c7; color:#b45309;" />
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Código do Item:</label>
        <input type="text" id="conf-item" class="input-left" oninput="atualizarRegraClienteManual()" />
      </div>
      <div>
        <label>Volume (Ex: 153/278):</label>
        <input type="text" id="conf-vol-etiqueta" class="input-left" placeholder="Opcional" />
      </div>
    </div>

    <label>Descrição do Produto:</label>
    <input type="text" id="conf-produto" class="input-left" />

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label id="label-volumes">Caixas/Sacos no Palete:</label>
        <input type="number" id="input-volumes" oninput="recalcularPreview()" style="border-color: var(--primary);" />
      </div>
      <div>
        <label>QTD Peças p/ Volume:</label>
        <input type="number" id="conf-pecas" oninput="recalcularPreview()" />
      </div>
    </div>

    <div class="saldo-preview">
      <small>Saldo Total deste Palete</small>
      <strong id="preview-total">0 peças</strong>
    </div>

    <button class="btn btn-confirm" onclick="confirmarEnvio()">✅ CONFIRMAR E SUBIR SALDO</button>
    <button class="btn btn-cancel" onclick="voltarParaCamera()">🔄 Fotografar Outra Etiqueta</button>
  </div>

  <!-- RESUMO AO VIVO NO CELULAR -->
  <div class="box">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <strong style="font-size:13px; color:var(--muted);">ÚLTIMOS LOTES SINCRONIZADOS</strong>
      <span style="font-size:11px; color:var(--success); font-weight:700;">● AO VIVO</span>
    </div>
    <div id="lista-ao-vivo">Carregando saldos...</div>
  </div>

  <!-- Div oculta apenas para decodificar código de barras/QR na foto -->
  <div id="qr-temp" style="display:none;"></div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http')
      ? ''
      : 'https://finart-wms.onrender.com';

    let streamCamera = null;

    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1450, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    // Abre a câmera traseira em Alta Definição (Full HD) para focar nas letras da etiqueta
    async function iniciarCameraHD() {
      const video = document.getElementById('video-hd');
      const imgCongelada = document.getElementById('foto-congelada');
      imgCongelada.style.display = 'none';
      video.style.display = 'block';

      try {
        if (streamCamera) {
          streamCamera.getTracks().forEach(t => t.stop());
        }
        streamCamera = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = streamCamera;
      } catch (err) {
        console.warn('Erro ao abrir câmera HD:', err);
      }
    }

    // Remove o fundo colorido (amarelo, verde ou rosa) da etiqueta para deixar as letras pretas super nítidas
    function criarImagemAltoContrasteParaOCR(canvasOriginal) {
      const c = document.createElement('canvas');
      c.width = canvasOriginal.width;
      c.height = canvasOriginal.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(canvasOriginal, 0, 0);

      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const d = imgData.data;

      for (let i = 0; i < d.length; i += 4) {
        // O canal mais brilhante ignora a tinta verde/amarela/rosa da etiqueta e destaca apenas a tinta preta do texto
        const maxChannel = Math.max(d[i], d[i + 1], d[i + 2]);
        const valor = maxChannel > 115 ? 255 : Math.max(0, (maxChannel - 40) * 2);
        d[i] = valor;
        d[i + 1] = valor;
        d[i + 2] = valor;
      }
      ctx.putImageData(imgData, 0, 0);
      return c;
    }

    // Tenta extrair também qualquer código de barras/QR presente na mesma foto
    async function tentarLerCodigoNaFoto(canvasOriginal) {
      return new Promise((resolve) => {
        canvasOriginal.toBlob(async (blob) => {
          if (!blob) return resolve('');
          const file = new File([blob], 'etiqueta.jpg', { type: 'image/jpeg' });
          try {
            const qr = new Html5Qrcode('qr-temp');
            const decoded = await qr.scanFile(file, false);
            resolve(decoded || '');
          } catch (e) {
            resolve('');
          }
        }, 'image/jpeg', 0.95);
      });
    }

    // Captura a foto do visor HD e digitaliza
    async function fotografarEDigitalizarVisor() {
      const video = document.getElementById('video-hd');
      if (!video || !video.videoWidth) {
        return alert('Aguarde a câmera iniciar ou use o botão de Foto Nativa logo abaixo.');
      }

      const canvasFoto = document.createElement('canvas');
      canvasFoto.width = video.videoWidth;
      canvasFoto.height = video.videoHeight;
      const ctx = canvasFoto.getContext('2d');
      ctx.drawImage(video, 0, 0, canvasFoto.width, canvasFoto.height);

      await executarDigitalizacaoCompleta(canvasFoto);
    }

    // Caso o usuário tire a foto pelo app nativo da câmera do celular
    function digitalizarFotoNativa(input) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvasFoto = document.createElement('canvas');
          canvasFoto.width = img.width;
          canvasFoto.height = img.height;
          canvasFoto.getContext('2d').drawImage(img, 0, 0);
          await executarDigitalizacaoCompleta(canvasFoto);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function executarDigitalizacaoCompleta(canvasFoto) {
      tocarBip();

      const dataUrlFoto = canvasFoto.toDataURL('image/jpeg', 0.9);
      const video = document.getElementById('video-hd');
      const imgCongelada = document.getElementById('foto-congelada');
      const laser = document.getElementById('laser-scan');
      const statusBox = document.getElementById('status-leitura');
      const btnFoto = document.getElementById('btn-fotografar');

      // Congela a foto na tela e ativa o laser de digitalização
      video.style.display = 'none';
      imgCongelada.src = dataUrlFoto;
      imgCongelada.style.display = 'block';
      laser.style.display = 'block';
      statusBox.style.display = 'block';
      btnFoto.disabled = true;

      try {
        const canvasNitido = criarImagemAltoContrasteParaOCR(canvasFoto);

        // Executa em paralelo: Digitalização do Texto (OCR) + Leitura de Código na foto
        const [ocrResult, codigoExtraido] = await Promise.all([
          Tesseract.recognize(canvasNitido, 'por'),
          tentarLerCodigoNaFoto(canvasFoto)
        ]);

        const textoDigitalizado = (ocrResult && ocrResult.data && ocrResult.data.text) ? ocrResult.data.text : '';

        const res = await fetch(`${API_BASE}/api/interpretar-bipe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            textoEtiqueta: textoDigitalizado,
            codigoLido: codigoExtraido
          })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(`❌ ${data.erro}`);
          voltarParaCamera();
          return;
        }

        // Preenche os dados reais extraídos da etiqueta
        document.getElementById('img-conferencia').src = dataUrlFoto;
        document.getElementById('conf-cliente').value = data.cliente;
        document.getElementById('conf-pedido').value = data.pedido;
        document.getElementById('conf-lote').value = data.lote;
        document.getElementById('conf-item').value = data.item;
        document.getElementById('conf-produto').value = data.produto;
        document.getElementById('conf-pecas').value = data.qtd_pecas_por_volume;
        document.getElementById('conf-vol-etiqueta').value = data.volume_etiqueta || '';
        document.getElementById('label-volumes').innerText = `Qtd ${data.tipoEmbalagem}S (Padrão: ${data.qtd_volumes_sugerida}):`;
        document.getElementById('input-volumes').value = data.qtd_volumes_sugerida;

        recalcularPreview();
        tocarBip();

        document.getElementById('tela-scanner').style.display = 'none';
        document.getElementById('tela-confirmacao').style.display = 'block';
      } catch (err) {
        alert('Falha ao digitalizar a imagem. Tente novamente aproximando mais da etiqueta.');
        voltarParaCamera();
      } finally {
        laser.style.display = 'none';
        statusBox.style.display = 'none';
        btnFoto.disabled = false;
      }
    }

    function atualizarRegraClienteManual() {
      const cli = (document.getElementById('conf-cliente').value || '').toUpperCase();
      const item = (document.getElementById('conf-item').value || '').toUpperCase();
      const prod = (document.getElementById('conf-produto').value || '').toUpperCase();

      if (cli.includes('DEVINTEX') && (item === 'PT-7908' || prod.includes('1000 GRS'))) {
        document.getElementById('input-volumes').value = 22;
      } else if (cli.includes('DEVINTEX')) {
        document.getElementById('input-volumes').value = 15;
      } else if (cli.length > 2) {
        document.getElementById('input-volumes').value = 20;
      }
      recalcularPreview();
    }

    function recalcularPreview() {
      const vols = parseInt(document.getElementById('input-volumes').value || '0', 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value || '0', 10);
      const total = vols * pecas;
      document.getElementById('preview-total').innerText = `${total.toLocaleString('pt-BR')} peças`;
    }

    async function confirmarEnvio() {
      const vols = parseInt(document.getElementById('input-volumes').value, 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value, 10);
      if (!vols || vols <= 0 || !pecas || pecas <= 0) {
        return alert('Verifique a quantidade de caixas e de peças por caixa!');
      }

      const payload = {
        cliente: document.getElementById('conf-cliente').value,
        pedido: document.getElementById('conf-pedido').value,
        lote: document.getElementById('conf-lote').value,
        item: document.getElementById('conf-item').value,
        produto: document.getElementById('conf-produto').value,
        qtd_volumes_palete: vols,
        qtd_pecas_por_volume: pecas,
        volume_etiqueta: document.getElementById('conf-vol-etiqueta').value
      };

      const res = await fetch(`${API_BASE}/api/paletes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const resultado = await res.json();
      if (!res.ok) {
        alert(resultado.erro);
        return;
      }

      tocarBip();
      atualizarResumoAoVivo();
      voltarParaCamera();
    }

    function voltarParaCamera() {
      document.getElementById('tela-confirmacao').style.display = 'none';
      document.getElementById('tela-scanner').style.display = 'block';
      iniciarCameraHD();
    }

    async function atualizarResumoAoVivo() {
      try {
        const res = await fetch(`${API_BASE}/api/dashboard?t=${Date.now()}`, { cache: 'no-store' });
        const { consolidado } = await res.json();
        const div = document.getElementById('lista-ao-vivo');
        if (!consolidado || consolidado.length === 0) {
          div.innerHTML = '<small style="color:var(--muted)">Nenhum palete bipado ainda.</small>';
          return;
        }
        div.innerHTML = consolidado.slice(0, 5).map(r => `
          <div class="live-item">
            <div>
              <strong>${r.cliente}</strong> <span class="badge-lote">Lote ${r.lote}</span><br/>
              <small style="color:var(--muted)">${r.item} • ${r.total_paletes} palete(s) (${r.total_caixas_ou_sacaria} vol.)</small>
            </div>
            <strong style="color:var(--success); font-size:15px;">${r.saldo_total_pecas.toLocaleString('pt-BR')} pçs</strong>
          </div>
        `).join('');
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) atualizarResumoAoVivo();
    });
    setInterval(atualizarResumoAoVivo, 2000);

    window.onload = () => {
      iniciarCameraHD();
      atualizarResumoAoVivo();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FINART Coletor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FINART - Coletor Industrial</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --warning-bg: #fffbeb;
      --warning-border: #f59e0b;
      --warning-text: #92400e;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      padding: 10px;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s ease;
    }

    body.flash-leitura {
      background-color: #bbf7d0 !important;
    }

    .top-bar {
      background: var(--card);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .logo {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 6px;
      letter-spacing: 1px;
      font-size: 14px;
    }
    .btn-top {
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: #e0f2fe;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      width: 100%;
    }

    .status-motor {
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 8px;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zoom-badge {
      background: #0284c7;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .visor-wrapper {
      position: relative;
      width: 100%;
      height: 270px;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary);
    }
    #video-camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }
    .moldura-etiqueta {
      position: absolute;
      inset: 14px;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }
    .moldura-etiqueta span {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      text-align: center;
    }

    .progresso-box {
      display: none;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #fef3c7;
      color: #b45309;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    /* ÁREA INFERIOR COM O BOTÃO GIGANTE DE MACRO DIRETA */
    .macro-bottom-zone {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-macro-direta-gigante {
      width: 100%;
      min-height: 92px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.1s ease;
    }
    .btn-macro-direta-gigante:active {
      transform: scale(0.98);
    }
    .btn-macro-direta-gigante small {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
    }

    .btn-camera-externa-aux {
      width: 100%;
      padding: 11px;
      background: #f1f5f9;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ALERTA INTELIGENTE DE DIVERGÊNCIA */
    .alerta-divergencia {
      display: none;
      background: var(--warning-bg);
      border: 2px solid var(--warning-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .alerta-divergencia h4 {
      color: var(--warning-text);
      font-size: 14px;
      margin-bottom: 6px;
    }
    .alerta-divergencia p {
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .alerta-botoes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .btn-corrigir-sugestao {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-manter-lido {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-confirm {
      background: var(--success);
      color: #fff;
      font-size: 16px;
      padding: 16px;
    }
    .btn-cancel {
      background: #e2e8f0;
      color: var(--text);
    }

    /* AUTO-COMPLETE FLUTUANTE DO HISTÓRICO */
    .field-wrap {
      position: relative;
      width: 100%;
    }
    .autocomplete-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
      max-height: 190px;
      overflow-y: auto;
      z-index: 99;
      margin-top: 2px;
    }
    .autocomplete-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:active, .autocomplete-item:hover { background: #e0f2fe; }
    .autocomplete-item strong { color: var(--primary); display: block; font-size: 13px; }
    .autocomplete-item span { color: var(--muted); font-size: 11px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 8px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-align: center;
    }
    input:focus {
      border-color: var(--primary);
      outline: none;
    }
    .input-left {
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    .badge-lote {
      background: #fef3c7;
      color: #b45309;
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 11px;
    }

    .saldo-preview {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      margin: 12px 0 4px;
    }
    .saldo-preview small {
      color: var(--success);
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      display: block;
    }
    .saldo-preview strong {
      color: var(--success);
      font-size: 22px;
      font-weight: 900;
    }

    .live-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 8px;
    }
    .live-item:last-child { border-bottom: none; }
  </style>
</head>
<body ontouchstart="destravarSomMobile()" onclick="fecharTodosAutocompletes(event)">

  <audio id="player-bip-leitura" preload="auto"></audio>
  <audio id="player-bip-confirmacao" preload="auto"></audio>

  <div class="top-bar">
    <span class="logo">FINART</span>
    <button class="btn-top" onclick="tocarSomApontamentoZebra()">🔊 Testar Som</button>
    <a href="/" class="btn-top">Ver Painel</a>
  </div>

  <!-- TELA 1: VISOR COM LENTE MACRO DIRETA INTEGRADA + BOTÃO GRANDE EMBAIXO -->
  <div class="box" id="tela-scanner">
    <div class="status-motor">
      <span id="status-motor">⚡ Iniciando Lente Macro HD...</span>
      <span class="zoom-badge" id="btn-zoom-toggle" onclick="alternarMacroZoom()">🔍 Macro 2.0x ON</span>
    </div>

    <div class="visor-wrapper">
      <video id="video-camera" autoplay playsinline muted></video>
      <div class="moldura-etiqueta">
        <span>Aponte para a etiqueta e aperte o botão azul abaixo</span>
      </div>
    </div>

    <div class="progresso-box" id="progresso-box">
      🔍 Captura Macro realizada! Lendo etiqueta...
    </div>

    <!-- BOTÃO GIGANTE NO ESPAÇO INFERIOR QUE JÁ USA A MACRO DIRETA SEM ABRIR OUTRO APP -->
    <div class="macro-bottom-zone">
      <button class="btn-macro-direta-gigante" onclick="capturarEtiquetaDoVisor(true)">
        <span>🔍 APONTAR COM MACRO DIRETA</span>
        <small>Captura em Foco Macro HD instantaneamente sem sair da tela</small>
      </button>

      <input type="file" accept="image/*" capture="environment" id="input-macro" style="display:none" onchange="lerFotoMacro(this)" />
      <button class="btn-camera-externa-aux" onclick="tocarBipLeituraCurto(); document.getElementById('input-macro').click()">
        📷 Ou abrir aplicativo de câmera nativo do celular
      </button>
    </div>
  </div>

  <!-- TELA 2: CONFERÊNCIA INTELIGENTE DO PALETE -->
  <div class="box" id="tela-confirmacao" style="display: none;">
    <h3 style="margin-bottom: 6px; font-size: 16px; color: var(--primary);">✅ Conferência Inteligente do Palete</h3>

    <div class="alerta-divergencia" id="box-divergencia">
      <h4>⚠️ Dúvida Detectada na Leitura</h4>
      <p id="texto-divergencia"></p>
      <div class="alerta-botoes">
        <button class="btn-corrigir-sugestao" id="btn-aceitar-sugestao" onclick="aplicarSugestaoDivergencia()">
          ✅ Corrigir para o item oficial
        </button>
        <button class="btn-manter-lido" onclick="fecharAlertaDivergencia()">
          Manter como está na tela
        </button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div class="field-wrap">
        <label>Código do Item:</label>
        <input
          type="text"
          id="conf-item"
          class="input-left"
          autocomplete="off"
          placeholder="Ex: PT-7908"
          onfocus="mostrarAutocomplete('item', this.value)"
          oninput="mostrarAutocomplete('item', this.value)"
        />
        <div class="autocomplete-list" id="ac-item"></div>
      </div>
      <div>
        <label>Volume (Ex: 370/400):</label>
        <input type="text" id="conf-vol-etiqueta" class="input-left" placeholder="Opcional" />
      </div>
    </div>

    <div class="field-wrap">
      <label>Descrição do Produto (Auto-complete do histórico):</label>
      <input
        type="text"
        id="conf-produto"
        class="input-left"
        autocomplete="off"
        placeholder="Digite parte do nome..."
        onfocus="mostrarAutocomplete('produto', this.value)"
        oninput="mostrarAutocomplete('produto', this.value)"
      />
      <div class="autocomplete-list" id="ac-produto"></div>
    </div>

    <div class="field-wrap">
      <label>Cliente:</label>
      <input
        type="text"
        id="conf-cliente"
        class="input-left"
        autocomplete="off"
        onfocus="mostrarAutocomplete('cliente', this.value)"
        oninput="mostrarAutocomplete('cliente', this.value); atualizarRegraClienteManual();"
      />
      <div class="autocomplete-list" id="ac-cliente"></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Pedido (Máx 6 díg.):</label>
        <input type="text" id="conf-pedido" class="input-left" maxlength="6" oninput="mascaraPedidoColetor(this)" />
      </div>
      <div class="field-wrap">
        <label>Nº do Lote (1 ponto):</label>
        <input
          type="text"
          id="conf-lote"
          class="input-left"
          maxlength="8"
          autocomplete="off"
          style="background:#fef3c7; color:#b45309;"
          onfocus="mostrarAutocomplete('lote', this.value)"
          oninput="mascaraLoteColetor(this); mostrarAutocomplete('lote', this.value);"
        />
        <div class="autocomplete-list" id="ac-lote"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label id="label-volumes">Caixas/Sacos Palete:</label>
        <input type="number" id="input-volumes" oninput="recalcularPreview()" style="border-color: var(--primary); font-size: 18px;" />
      </div>
      <div>
        <label>QTD Peças p/ Caixa:</label>
        <input type="number" id="conf-pecas" oninput="recalcularPreview()" style="font-size: 18px;" />
      </div>
    </div>

    <div class="saldo-preview">
      <small>Saldo Total deste Palete</small>
      <strong id="preview-total">0 peças</strong>
    </div>

    <button class="btn btn-confirm" onclick="confirmarEnvio()">✅ CONFIRMAR E SUBIR SALDO</button>
    <button class="btn btn-cancel" onclick="voltarParaCamera()">🔄 Ler Outra Etiqueta</button>
  </div>

  <!-- SÓ APARECE DEPOIS QUE VOCÊ BIPAR UM PALETE NESTA SESSÃO -->
  <div class="box" id="box-saldos-sessao" style="display: none;">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <strong style="font-size:12px; color:var(--muted);">SALDO APONTADO AGORA</strong>
      <span style="font-size:11px; color:var(--success); font-weight:700;">● SINCRONIZADO</span>
    </div>
    <div id="lista-ao-vivo"></div>
  </div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http')
      ? ''
      : 'https://finart-wms.onrender.com';

    // Limpa imediatamente qualquer rastro antigo de PT-7808 salvo no navegador do celular
    (function limparCodigoErradoCache() {
      try {
        const cat = JSON.parse(localStorage.getItem('finart_backup_catalogo') || '[]')
          .filter(c => c.item !== 'PT-7808' && c.item !== 'PT7808');
        localStorage.setItem('finart_backup_catalogo', JSON.stringify(cat));

        const hist = JSON.parse(localStorage.getItem('finart_backup_paletes') || '[]')
          .map(p => ({ ...p, item: (p.item === 'PT-7808' ? 'PT-7908' : p.item) }));
        localStorage.setItem('finart_backup_paletes', JSON.stringify(hist));
      } catch (e) {}
    })();

    let ocrWorker = null;
    let motorPronto = false;
    let lendoAgora = false;
    let timerAutoScan = null;
    let streamVideo = null;
    let audioCtx = null;
    let catalogoMemoria = [];
    let historicoMemoria = [];
    let sugestaoAtual = null;
    let jaBipouNestaSessao = false;
    let macroZoomAtivo = true;

    function limparPedidoEstrito(val = '') {
      return String(val).trim().split('.')[0].replace(/\D/g, '').slice(0, 6);
    }

    function limparLoteEstrito(val = '', pedidoRef = '') {
      let limpo = String(val).replace(/,/g, '.').replace(/[^0-9.]/g, '');
      const partes = limpo.split('.').filter(Boolean);
      if (partes.length === 0) {
        const p = limparPedidoEstrito(pedidoRef);
        return p ? `${p}.1` : '';
      }
      if (partes.length === 1) {
        const n = partes[0];
        if (n.length === 7) return `${n.slice(0, 6)}.${n.slice(6, 7)}`;
        return limpo.includes('.') ? `${n.slice(0, 6)}.` : n.slice(0, 6);
      }
      return `${partes[0].slice(0, 6)}.${partes[1].slice(0, 1)}`.slice(0, 8);
    }

    function mascaraPedidoColetor(input) {
      input.value = limparPedidoEstrito(input.value);
      if (input.value.length >= 5) {
        document.getElementById('conf-lote').value = `${input.value}.1`;
      }
    }

    function mascaraLoteColetor(input) {
      input.value = limparLoteEstrito(input.value);
    }

    // GERADOR DE ÁUDIO PADRÃO COLETOR ZEBRA/HONEYWELL (Pulso limpo e encorpado com envelope suave)
    function criarSomColetorZebraBase64(notas = [{ f: 800, ini: 0.0, fim: 0.07 }, { f: 1180, ini: 0.075, fim: 0.19 }], duracao = 0.21) {
      const sampleRate = 44100;
      const numSamples = Math.floor(sampleRate * duracao);
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        let sinal = 0;
        notas.forEach((n) => {
          if (t >= n.ini && t <= n.fim) {
            const localT = t - n.ini;
            const dur = n.fim - n.ini;
            // Ataque rápido de 5ms e decaimento exponencial limpo (sem chiado e sem ser estridente)
            const ataque = Math.min(1, localT / 0.005);
            const queda = Math.exp(-localT * (3.5 / dur));
            const env = ataque * queda;

            const fundamental = Math.sin(2 * Math.PI * n.f * t);
            const oitavaSuave = Math.sin(2 * Math.PI * (n.f * 1.5) * t) * 0.18;
            sinal += (fundamental + oitavaSuave) * env * 0.85;
          }
        });
        const intSample = Math.max(-32767, Math.min(32767, Math.floor(sinal * 32767)));
        view.setInt16(44 + i * 2, intSample, true);
      }

      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    const wavLeituraCurtoURI = criarSomColetorZebraBase64(
      [{ f: 920, ini: 0.0, fim: 0.085 }],
      0.10
    );

    const wavApontamentoZebraURI = criarSomColetorZebraBase64(
      [
        { f: 780, ini: 0.00, fim: 0.075 },
        { f: 1170, ini: 0.08, fim: 0.21 }
      ],
      0.23
    );

    function destravarSomMobile() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const p1 = document.getElementById('player-bip-leitura');
        const p2 = document.getElementById('player-bip-confirmacao');
        if (!p1.src) p1.src = wavLeituraCurtoURI;
        if (!p2.src) p2.src = wavApontamentoZebraURI;
      } catch (e) {}
    }

    function tocarBipLeituraCurto() {
      try {
        destravarSomMobile();
        if (navigator.vibrate) navigator.vibrate(140);
        document.body.classList.add('flash-leitura');
        setTimeout(() => document.body.classList.remove('flash-leitura'), 240);

        const p1 = document.getElementById('player-bip-leitura');
        if (!p1.src) p1.src = wavLeituraCurtoURI;
        p1.volume = 1.0;
        p1.currentTime = 0;
        p1.play().catch(() => {});
      } catch (e) {}
    }

    function tocarSomApontamentoZebra() {
      try {
        destravarSomMobile();
        if (navigator.vibrate) navigator.vibrate([100, 40, 160]);

        if (audioCtx) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          [
            { f: 780, ini: 0.00, dur: 0.075 },
            { f: 1170, ini: 0.08, dur: 0.13 }
          ].forEach((n) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n.f, now + n.ini);
            gain.gain.setValueAtTime(0.01, now + n.ini);
            gain.gain.linearRampToValueAtTime(0.85, now + n.ini + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.008, now + n.ini + n.dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + n.ini);
            osc.stop(now + n.ini + n.dur + 0.01);
          });
        }

        const p2 = document.getElementById('player-bip-confirmacao');
        if (!p2.src) p2.src = wavApontamentoZebraURI;
        p2.volume = 1.0;
        p2.currentTime = 0;
        p2.play().catch(() => {});
      } catch (e) {}
    }

    // AUTO-COMPLETE INTELIGENTE DO HISTÓRICO (Sem PT-7808)
    function fecharTodosAutocompletes(e) {
      if (e && e.target && e.target.tagName === 'INPUT') return;
      document.querySelectorAll('.autocomplete-list').forEach(el => el.style.display = 'none');
    }

    function mostrarAutocomplete(tipo, valorDigitado) {
      document.querySelectorAll('.autocomplete-list').forEach(el => el.style.display = 'none');
      const termo = (valorDigitado || '').trim().toUpperCase();

      const baseItens = catalogoMemoria.filter(c => c.item !== 'PT-7808');
      historicoMemoria.forEach(h => {
        if (h.item !== 'PT-7808' && !baseItens.some(c => c.item === h.item)) {
          baseItens.push({
            item: h.item,
            cliente: h.cliente,
            produto: h.produto,
            padrao_volumes_palete: h.qtd_volumes_palete,
            qtd_padrao_pecas: h.qtd_pecas_por_volume
          });
        }
      });

      if (tipo === 'produto' || tipo === 'item') {
        const box = document.getElementById(tipo === 'produto' ? 'ac-produto' : 'ac-item');
        const filtrados = baseItens.filter(c =>
          c.produto.toUpperCase().includes(termo) ||
          c.item.toUpperCase().includes(termo)
        );
        if (filtrados.length === 0) return;

        box.innerHTML = filtrados.map((c, idx) => `
          <div class="autocomplete-item" onclick="selecionarItemAutocomplete(${idx}, '${tipo}')">
            <strong>${c.item} — ${c.produto}</strong>
            <span>Cliente: ${c.cliente} • Padrão: ${c.padrao_volumes_palete} vol. x ${c.qtd_padrao_pecas} pçs</span>
          </div>
        `).join('');
        box.dataset.lista = JSON.stringify(filtrados);
        box.style.display = 'block';
      } else if (tipo === 'cliente') {
        const box = document.getElementById('ac-cliente');
        const clientesUnicos = [...new Set(baseItens.map(c => c.cliente))].filter(cli => cli.toUpperCase().includes(termo));
        if (clientesUnicos.length === 0) return;

        box.innerHTML = clientesUnicos.map(cli => `
          <div class="autocomplete-item" onclick="selecionarClienteAutocomplete('${cli}')">
            <strong>${cli}</strong>
          </div>
        `).join('');
        box.style.display = 'block';
      } else if (tipo === 'lote') {
        const box = document.getElementById('ac-lote');
        const lotesUnicos = [];
        historicoMemoria.forEach(h => {
          if (!lotesUnicos.some(l => l.lote === h.lote) && h.lote.includes(termo)) {
            lotesUnicos.push(h);
          }
        });
        if (lotesUnicos.length === 0) return;

        box.innerHTML = lotesUnicos.slice(0, 6).map((h) => `
          <div class="autocomplete-item" onclick="selecionarLoteAutocomplete('${h.lote}', '${h.pedido}', '${h.item}')">
            <strong>Lote: ${h.lote} (Ped: ${h.pedido})</strong>
            <span>${h.item} — ${h.produto}</span>
          </div>
        `).join('');
        box.style.display = 'block';
      }
    }

    function selecionarItemAutocomplete(idx, tipo) {
      const box = document.getElementById(tipo === 'produto' ? 'ac-produto' : 'ac-item');
      const lista = JSON.parse(box.dataset.lista || '[]');
      const escolhido = lista[idx];
      if (!escolhido) return;

      document.getElementById('conf-item').value = escolhido.item;
      document.getElementById('conf-produto').value = escolhido.produto;
      document.getElementById('conf-cliente').value = escolhido.cliente;
      document.getElementById('input-volumes').value = escolhido.padrao_volumes_palete || 15;
      if (escolhido.qtd_padrao_pecas > 0) {
        document.getElementById('conf-pecas').value = escolhido.qtd_padrao_pecas;
      }
      recalcularPreview();
      fecharTodosAutocompletes();
    }

    function selecionarClienteAutocomplete(cli) {
      document.getElementById('conf-cliente').value = cli;
      atualizarRegraClienteManual();
      fecharTodosAutocompletes();
    }

    function selecionarLoteAutocomplete(lote, pedido, itemAssociado) {
      document.getElementById('conf-lote').value = limparLoteEstrito(lote, pedido);
      document.getElementById('conf-pedido').value = limparPedidoEstrito(pedido || lote);
      const mem = catalogoMemoria.find(c => c.item === itemAssociado);
      if (mem) {
        document.getElementById('conf-item').value = mem.item;
        document.getElementById('conf-produto').value = mem.produto;
        document.getElementById('conf-cliente').value = mem.cliente;
        document.getElementById('input-volumes').value = mem.padrao_volumes_palete;
        document.getElementById('conf-pecas').value = mem.qtd_padrao_pecas;
        recalcularPreview();
      }
      fecharTodosAutocompletes();
    }

    async function inicializarMotorOptico() {
      const badge = document.getElementById('status-motor');
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({ tessedit_pageseg_mode: '6' });
        motorPronto = true;
        badge.innerText = '✅ Lente Macro HD Pronta';
      } catch (e) {
        badge.innerText = '⚠️ Leitor ativo';
      }
    }

    // LENTE MACRO DIRETA NO PRÓPRIO VISOR (Ativa Foco Contínuo de Perto + Zoom Macro 1.8x sem abrir outro app)
    async function iniciarCameraMacroDireta() {
      const video = document.getElementById('video-camera');
      try {
        if (streamVideo) streamVideo.getTracks().forEach(t => t.stop());
        streamVideo = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = streamVideo;

        aplicarConfiguracaoMacroNaLente();

        if (timerAutoScan) clearInterval(timerAutoScan);
        timerAutoScan = setInterval(() => {
          if (!lendoAgora && motorPronto && document.getElementById('tela-scanner').style.display !== 'none') {
            capturarEtiquetaDoVisor(false);
          }
        }, 1500);
      } catch (err) {}
    }

    async function aplicarConfiguracaoMacroNaLente() {
      const video = document.getElementById('video-camera');
      const btnZoom = document.getElementById('btn-zoom-toggle');
      if (!streamVideo) return;

      const track = streamVideo.getVideoTracks()[0];
      if (!track) return;

      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const adv = {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          adv.focusMode = 'continuous';
        }
        if (caps.zoom) {
          const zoomIdeal = macroZoomAtivo ? Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1.8)) : caps.zoom.min;
          adv.zoom = zoomIdeal;
          video.style.transform = 'scale(1)';
        } else {
          // Se o navegador (ex: iOS) não expõe zoom via hardware, aplica recorte central HD de alta definição
          video.style.transform = macroZoomAtivo ? 'scale(1.45)' : 'scale(1)';
        }
        if (Object.keys(adv).length > 0) {
          await track.applyConstraints({ advanced: [adv] });
        }
      } catch (e) {
        video.style.transform = macroZoomAtivo ? 'scale(1.45)' : 'scale(1)';
      }

      btnZoom.innerText = macroZoomAtivo ? '🔍 Macro 2.0x ON' : '🔍 Macro 1.0x';
    }

    function alternarMacroZoom() {
      macroZoomAtivo = !macroZoomAtivo;
      aplicarConfiguracaoMacroNaLente();
    }

    // Recorta o centro da imagem em alta definição quando o modo Macro Direta está ativo
    function prepararCanvasEtiquetaNitido(fonteImgOuVideo, wOrig, hOrig, usarRecorteMacro = false) {
      const canvas = document.createElement('canvas');
      const maxDim = 1200;

      let sx = 0, sy = 0, sw = wOrig, sh = hOrig;
      if (usarRecorteMacro && macroZoomAtivo) {
        // Recorta a região central focada da etiqueta para leitura ultra nítida
        sw = Math.round(wOrig * 0.78);
        sh = Math.round(hOrig * 0.78);
        sx = Math.round((wOrig - sw) / 2);
        sy = Math.round((hOrig - sh) / 2);
      }

      let w = sw;
      let h = sh;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.filter = 'contrast(1.35) grayscale(0.5)';
      ctx.drawImage(fonteImgOuVideo, sx, sy, sw, sh, 0, 0, w, h);
      return canvas;
    }

    async function capturarEtiquetaDoVisor(manual) {
      const video = document.getElementById('video-camera');
      if (!video || !video.videoWidth || lendoAgora) return;

      destravarSomMobile();
      if (manual) tocarBipLeituraCurto();
      lendoAgora = true;
      const prog = document.getElementById('progresso-box');
      if (manual) prog.style.display = 'block';

      try {
        const canvas = prepararCanvasEtiquetaNitido(video, video.videoWidth, video.videoHeight, true);
        await reconhecerTextoEEnviar(canvas, manual);
      } finally {
        if (manual) prog.style.display = 'none';
        lendoAgora = false;
      }
    }

    function lerFotoMacro(input) {
      if (!input.files || !input.files[0]) return;
      destravarSomMobile();
      lendoAgora = true;
      const prog = document.getElementById('progresso-box');
      prog.style.display = 'block';

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          try {
            const canvas = prepararCanvasEtiquetaNitido(img, img.width, img.height, false);
            await reconhecerTextoEEnviar(canvas, true);
          } finally {
            prog.style.display = 'none';
            lendoAgora = false;
            input.value = '';
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    async function tentarBarcodeNativo(canvas) {
      if ('BarcodeDetector' in window) {
        try {
          const detector = new BarcodeDetector({ formats: ['code_128', 'qr_code', 'ean_13'] });
          const barcodes = await detector.detect(canvas);
          if (barcodes && barcodes.length > 0) {
            return barcodes.map(b => b.rawValue).join('\n');
          }
        } catch (e) {}
      }
      return '';
    }

    async function reconhecerTextoEEnviar(canvas, mostrarAlertaSeFalhar) {
      try {
        const [codigoNativo, ocrRes] = await Promise.all([
          tentarBarcodeNativo(canvas),
          (motorPronto && ocrWorker) ? ocrWorker.recognize(canvas) : Tesseract.recognize(canvas, 'eng')
        ]);

        const textoExtraido = (ocrRes && ocrRes.data && ocrRes.data.text) ? ocrRes.data.text : '';
        const tudo = `${codigoNativo}\n${textoExtraido}`;

        const temDadosValidos = /PEDIDO|CLIENTE|DEVINTEX|FLORA|ITEM|PRODUTO|LOTE|006\d{3}|PT\s*-\s*\d|FR\s*-\s*\d|719935/i.test(tudo);
        if (!temDadosValidos) {
          if (mostrarAlertaSeFalhar) {
            alert('Etiqueta não identificada. Aproxime ou enquadre a etiqueta no tracejado e toque no botão azul.');
          }
          return;
        }

        const res = await fetch(`${API_BASE}/api/interpretar-bipe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            codigoLido: codigoNativo,
            textoEtiqueta: textoExtraido
          })
        });

        const data = await res.json();
        if (!res.ok) {
          if (mostrarAlertaSeFalhar) alert(data.erro || 'Tente aproximar um pouco mais da etiqueta.');
          return;
        }

        if (!mostrarAlertaSeFalhar && (!data.item || !data.lote || !data.qtd_pecas_por_volume)) {
          return;
        }

        if (timerAutoScan) clearInterval(timerAutoScan);

        tocarBipLeituraCurto();
        abrirTelaConfirmacao(data);
      } catch (e) {
        if (mostrarAlertaSeFalhar) alert('Erro ao processar leitura.');
      }
    }

    function abrirTelaConfirmacao(data) {
      const pedLimpo = limparPedidoEstrito(data.pedido || data.lote);
      const loteLimpo = limparLoteEstrito(data.lote, pedLimpo);

      document.getElementById('conf-cliente').value = data.cliente || '';
      document.getElementById('conf-pedido').value = pedLimpo;
      document.getElementById('conf-lote').value = loteLimpo;
      document.getElementById('conf-item').value = (data.item === 'PT-7808' ? 'PT-7908' : (data.item || ''));
      document.getElementById('conf-produto').value = data.produto || '';
      document.getElementById('conf-pecas').value = data.qtd_pecas_por_volume || '';
      document.getElementById('conf-vol-etiqueta').value = data.volume_etiqueta || '';
      document.getElementById('label-volumes').innerText = `Qtd ${data.tipoEmbalagem || 'CAIXA'}S (Padrão: ${data.qtd_volumes_sugerida || 15}):`;
      document.getElementById('input-volumes').value = data.qtd_volumes_sugerida || 15;

      const boxDiv = document.getElementById('box-divergencia');
      if (data.sugestao_divergencia) {
        sugestaoAtual = data.sugestao_divergencia;
        document.getElementById('texto-divergencia').innerText = sugestaoAtual.mensagem;
        document.getElementById('btn-aceitar-sugestao').innerText =
          sugestaoAtual.tipo === 'LOTE_PARECIDO'
            ? `✅ Corrigir para Lote ${sugestaoAtual.lote_sugerido}`
            : `✅ Corrigir para ${sugestaoAtual.item_sugerido} (${sugestaoAtual.produto_sugerido.slice(0, 28)}...)`;
        boxDiv.style.display = 'block';
      } else {
        sugestaoAtual = null;
        boxDiv.style.display = 'none';
      }

      recalcularPreview();
      document.getElementById('tela-scanner').style.display = 'none';
      document.getElementById('tela-confirmacao').style.display = 'block';
    }

    function aplicarSugestaoDivergencia() {
      if (!sugestaoAtual) return;
      document.getElementById('conf-item').value = sugestaoAtual.item_sugerido;
      document.getElementById('conf-cliente').value = sugestaoAtual.cliente_sugerido;
      document.getElementById('conf-produto').value = sugestaoAtual.produto_sugerido;
      if (sugestaoAtual.qtd_pecas_sugerida > 0) {
        document.getElementById('conf-pecas').value = sugestaoAtual.qtd_pecas_sugerida;
      }
      if (sugestaoAtual.qtd_volumes_sugerida > 0) {
        document.getElementById('input-volumes').value = sugestaoAtual.qtd_volumes_sugerida;
      }
      if (sugestaoAtual.lote_sugerido) {
        document.getElementById('conf-lote').value = sugestaoAtual.lote_sugerido;
      }
      if (sugestaoAtual.pedido_sugerido) {
        document.getElementById('conf-pedido').value = sugestaoAtual.pedido_sugerido;
      }
      recalcularPreview();
      fecharAlertaDivergencia();
      tocarBipLeituraCurto();
    }

    function fecharAlertaDivergencia() {
      document.getElementById('box-divergencia').style.display = 'none';
    }

    function atualizarRegraClienteManual() {
      const cli = (document.getElementById('conf-cliente').value || '').toUpperCase();
      const item = (document.getElementById('conf-item').value || '').toUpperCase();
      const prod = (document.getElementById('conf-produto').value || '').toUpperCase();

      if (cli.includes('DEVINTEX') && (item === 'PT-7908' || prod.includes('1000 GRS'))) {
        document.getElementById('input-volumes').value = 22;
      } else if (cli.includes('DEVINTEX')) {
        document.getElementById('input-volumes').value = 15;
      } else if (cli.length > 2) {
        document.getElementById('input-volumes').value = 20;
      }
      recalcularPreview();
    }

    function recalcularPreview() {
      const vols = parseInt(document.getElementById('input-volumes').value || '0', 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value || '0', 10);
      const total = vols * pecas;
      document.getElementById('preview-total').innerText = `${total.toLocaleString('pt-BR')} peças`;
    }

    async function confirmarEnvio() {
      const vols = parseInt(document.getElementById('input-volumes').value, 10);
      const pecas = parseInt(document.getElementById('conf-pecas').value, 10);
      if (!vols || vols <= 0 || !pecas || pecas <= 0) {
        return alert('Verifique a quantidade de caixas e de peças por caixa!');
      }

      // TOCA O SOM DE APONTAMENTO PROFISSIONAL ZEBRA/HONEYWELL
      tocarSomApontamentoZebra();

      const pedLimpo = limparPedidoEstrito(document.getElementById('conf-pedido').value);
      let loteLimpo = limparLoteEstrito(document.getElementById('conf-lote').value, pedLimpo);
      if (loteLimpo.endsWith('.')) loteLimpo += '1';

      let itemFinal = (document.getElementById('conf-item').value || '').trim().toUpperCase();
      if (itemFinal === 'PT-7808') itemFinal = 'PT-7908';

      const payload = {
        cliente: document.getElementById('conf-cliente').value,
        pedido: pedLimpo,
        lote: loteLimpo,
        item: itemFinal,
        produto: document.getElementById('conf-produto').value,
        qtd_volumes_palete: vols,
        qtd_pecas_por_volume: pecas,
        volume_etiqueta: document.getElementById('conf-vol-etiqueta').value
      };

      const res = await fetch(`${API_BASE}/api/paletes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const resultado = await res.json();
      if (!res.ok) {
        alert(resultado.erro);
        return;
      }

      // SÓ AGORA LIBERA O QUADRO DE SALDO EMBAIXO NO CELULAR!
      jaBipouNestaSessao = true;
      document.getElementById('box-saldos-sessao').style.display = 'block';

      await carregarDadosSilencioso();
      voltarParaCamera();
    }

    function voltarParaCamera() {
      document.getElementById('tela-confirmacao').style.display = 'none';
      document.getElementById('tela-scanner').style.display = 'block';
      iniciarCameraMacroDireta();
    }

    async function carregarDadosSilencioso() {
      try {
        const res = await fetch(`${API_BASE}/api/dashboard?t=${Date.now()}`, { cache: 'no-store' });
        const { consolidado, historico, catalogo } = await res.json();

        const backupSalvo = JSON.parse(localStorage.getItem('finart_backup_paletes') || '[]');
        const catalogoSalvo = JSON.parse(localStorage.getItem('finart_backup_catalogo') || '[]')
          .filter(c => c.item !== 'PT-7808');

        if (historico.length === 0 && backupSalvo.length > 0) {
          const rRest = await fetch(`${API_BASE}/api/restaurar-backup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ historico: backupSalvo, catalogo: catalogoSalvo })
          });
          const resJson = await rRest.json();
          if (resJson && resJson.restaurado) {
            return carregarDadosSilencioso();
          } else {
            localStorage.setItem('finart_backup_paletes', '[]');
          }
        } else {
          localStorage.setItem('finart_backup_paletes', JSON.stringify(historico));
        }

        historicoMemoria = (historico || []).filter(h => h.item !== 'PT-7808');
        if (catalogo && catalogo.length > 0) {
          catalogoMemoria = catalogo.filter(c => c.item !== 'PT-7808');
          localStorage.setItem('finart_backup_catalogo', JSON.stringify(catalogoMemoria));
        }

        // Só renderiza a caixa inferior se o usuário já tiver bipado pelo menos 1 palete agora
        if (jaBipouNestaSessao) {
          const div = document.getElementById('lista-ao-vivo');
          if (!consolidado || consolidado.length === 0) {
            div.innerHTML = '<small style="color:var(--muted)">Nenhum palete ativo.</small>';
            return;
          }
          div.innerHTML = consolidado.slice(0, 6).map(r => `
            <div class="live-item">
              <div>
                <strong>${r.cliente}</strong> <span class="badge-lote">Lote ${limparLoteEstrito(r.lote, r.pedido)}</span><br/>
                <small style="color:var(--muted)">${r.item} • ${r.total_paletes} palete(s) (${r.total_caixas_ou_sacaria} vol.)</small>
              </div>
              <strong style="color:var(--success); font-size:14px; white-space:nowrap;">${r.saldo_total_pecas.toLocaleString('pt-BR')} pçs</strong>
            </div>
          `).join('');
        }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) carregarDadosSilencioso();
    });
    setInterval(carregarDadosSilencioso, 2500);

    window.onload = () => {
      inicializarMotorOptico();
      iniciarCameraMacroDireta();
      carregarDadosSilencioso();
    };
  </script>
